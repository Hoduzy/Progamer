# main 브랜치에 push하면 GitHub Pages로 자동 배포
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 자산 목록·서비스 워커 캐시 목록·버전을 새로 만들고, 절대 경로·대소문자 오류가 있으면 실패
      - name: 배포 파일 준비
        run: node tools/build-pages.mjs

      - name: 사이트 폴더 만들기
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js .nojekyll css js data assets icons _site/
          find _site -name '*.md' -delete

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
